name: Build PocketLP Windows & Android Artifacts

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-rust-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run 28-Scenario Rust Acceptance Suite
        working-directory: src-tauri
        run: cargo test -- --nocapture

  build-windows-x64:
    needs: test-rust-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Frontend Dependencies
        run: npm install
      - name: Build Windows 11 x64 Installer
        run: npx tauri build
      - name: Upload Windows Installer ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketLP-Windows11-x64-Installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/pocketlp.exe

  build-android-arm64:
    needs: test-rust-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK & API 36 SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Dependencies & Init Android Project
        run: |
          npm install
          npx tauri android init
          npx tauri android build --apk --target aarch64
      - name: Upload Android ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketLP-Android-ARM64-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk