[package]
name = "pocketlp"
version = "1.0.0"
description = "PocketLP Local-First Personal Pocket for Windows 11 and Android 16"
authors = ["Ram Tej Duvvuri"]
edition = "2021"

[lib]
name = "pocketlp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = "0.4"
tokio = { version = "1.41", features = ["full"] }

[dev-dependencies]
tempfile = "3.14"